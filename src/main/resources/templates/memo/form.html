<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/layouts/default}">


<section class="contents d-flex justify-content-center" layout:fragment="contents">
    <div class="contents-box my-5">
        <h2 class="text-center">메모 작성</h2>

        <input type="text" id="titleInput" class="form-control mt-4" placeholder="제목을 입력하세요">
        <textarea id="contentsInput" class="form-control mt-3" rows="12" placeholder="내용을 입력하세요"></textarea>
        <input class="mt-2" type="file" id="fileInput">
        <div class="d-flex justify-content-between mt-3">
            <a href="/memo/list" class="btn btn-secondary">목록으로</a>
            <button type="button" id="saveBtn" class="btn btn-secondary">저장</button>
        </div>
    </div>

</section>

<script layout:fragment="script">
    $("#saveBtn").on("click",function(){
        let title = $("#titleInput").val();
        let contents = $("#contentsInput").val();

        let file = $("#fileInput")[0].files[0];

        if(title==""){
            alert("제목을 입력하세요");
            return;
        }

        if(contents==""){
            alert("내용을 입력하세요");
            return;
        }

        let formData = new FormData();
        formData.append("title", title);
        formData.append("contents", contents);
        formData.append("imageFile", file)

        // 요청에 의한 구성요소들
        $.ajax({
            type:"post"
            , url:"/memo/write-process"
            , data: formData
            , processData: false
            , contentType: false
            , success:function(response){
                if(response.result == "success"){
                    location.href="/memo/list";
                }else{
                    alert("메모작성 실패!");
                }
            }
            ,error : function(){
                alert("메모작성 에러!!");
            }
        });
    });
</script>

</html>
