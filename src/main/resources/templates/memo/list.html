<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/layouts/default}">


    <section class="contents d-flex justify-content-center" layout:fragment="contents">
        <div class="contents-box my-3">
            <h2 class="text-center">메모 리스트</h2>

            <table class="table text-center mt-4">
                <thead>
                    <tr>
                        <th>No.</th>
                        <th>제목</th>
                        <th>작성 날짜</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="memo: ${memoList}">
                        <td th:text="${memo.id}">213</td>
                        <td><a th:text="${memo.title}" th:href="|/memo/detail?id=${memo.id}|">샘플 메모입니다.</a></td>
                        <td th:text="${#temporals.format(memo.createdAt, 'yyyy-MM-dd')}">2025-04-15</td>
                    </tr>
                </tbody>
            </table>
            <div class="d-flex justify-content-end mt-3">
                <a href="/memo/write" class="btn btn-secondary">메모쓰기</a>
            </div>
        </div>

    </section>

</html>
