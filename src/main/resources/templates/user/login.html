<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/layouts/default}">



    <section layout:fragment="contents" class="contents d-flex justify-content-center p-4">
        <div class="user-box p-5 my-5">
            <h2 class="text-center">로그인</h2>
            <input type="text" class="form-control mt-2" placeholder="아이디" id="idInput">
            <input type="password" class="form-control mt-2" placeholder="비밀번호" id="passwordInput">
            <button type="button" class="btn mt-3 btn-secondary btn-block" id="loginBtn">로그인</button>
            <div class="mt-4 d-flex justify-content-center">
                <a href="/user/join">회원가입</a>
            </div>
        </div>
    </section>

</html>
