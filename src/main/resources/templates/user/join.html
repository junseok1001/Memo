<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원 가입</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <div id="wrap">
        <header class="d-flex align-items-center">
            <h1 class="ml-3">Memo</h1>
        </header>
        <section class="contents d-flex justify-content-center p-4">
            <div class="user-box p-5 my-5">
                <h2 class="text-center">회원 가입</h2>
                <input type="text" class="form-control mt-2" placeholder="아이디">
                <input type="password" class="form-control mt-2" placeholder="비밀번호">
                <input type="password" class="form-control mt-2" placeholder="비밀번호 확인">
                <input type="text" class="form-control mt-2" placeholder="이름">
                <input type="text" class="form-control mt-2" placeholder="이메일">
                <button type="button" class="btn mt-3 btn-secondary btn-block">가입</button>
            </div>
        </section>
        <footer class="d-flex align-items-center justify-content-center">
            <div>ⓒ 2025. sourjelly All rights reserved.</div>
        </footer>
    </div>

</html>
